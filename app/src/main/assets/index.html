<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Моя новая жизнь — 3D</title><style>body{margin:0;overflow:hidden;background:#9bd1f0;font-family:Arial}#hud{position:absolute;top:12px;left:12px;color:white;text-shadow:0 2px 5px #333;background:#0006;padding:12px;border-radius:12px}#joy{position:absolute;bottom:25px;left:25px;width:125px;height:125px;border-radius:50%;background:#ffffff55;border:2px solid white;touch-action:none}#knob{position:absolute;left:43px;top:43px;width:39px;height:39px;border-radius:50%;background:#fff9}#action{position:absolute;right:24px;bottom:44px;border:0;border-radius:50%;height:90px;width:90px;background:#e85b6c;color:white;font-weight:bold;font-size:16px}#save{position:absolute;right:12px;top:12px;border:0;border-radius:10px;background:#183a59;color:white;padding:11px;font-weight:bold}#msg{position:absolute;bottom:160px;left:50%;transform:translateX(-50%);background:#111a;color:white;padding:10px;border-radius:10px;display:none}</style></head><body><div id="hud"><b>Моя новая жизнь</b><div>💰 Деньги: <span id="money">100</span> ₽</div><div>⚡ Энергия: <span id="energy">100</span>%</div><div>🍔 Сытость: <span id="hunger">100</span>%</div><div>😊 Настроение: <span id="mood">80</span>%</div><div>🕒 День: <span id="day">1</span></div><small>Подойди к зданию и нажми «Действие»</small></div><button id="save">💾 Сохранить</button><div id="msg"></div><div id="joy"><div id="knob"></div></div><button id="action">Действие</button><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x91c9f1);scene.fog=new THREE.Fog(0x91c9f1,45,110);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x58764e,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,35,10);sun.castShadow=true;scene.add(sun);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});function cube(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}cube(120,.2,120,0x68ad61,0,-.15,0);cube(8,.03,100,0x777e87,0,0,0);cube(100,.03,7,0x777e87,0,0,0);for(let i=-45;i<50;i+=10){cube(.2,.04,3,0xf4f2cb,0,.03,i);cube(3,.04,.2,0xf4f2cb,i,.03,0)}const buildings=[{x:-14,z:-12,c:0xe9b28d,name:'Дом',type:'home'},{x:15,z:-14,c:0x7da8d8,name:'Работа',type:'work'},{x:-14,z:14,c:0xf1cb72,name:'Магазин',type:'shop'}];for(const b of buildings){cube(10,9,9,b.c,b.x,4.5,b.z);cube(11,1,10,0x545d68,b.x,9.4,b.z);cube(2.5,4,.15,0x694b3c,b.x,2,b.z+4.58);for(const dx of [-3,3])for(const y of [3,6.5])cube(1.7,1.8,.18,0xa5e5f5,b.x+dx,y,b.z+4.6)}for(const [x,z,w,h,d,c] of [[-30,-32,11,12,12,0xb7c1cb],[30,-32,12,17,11,0x9aaab8],[-30,32,13,15,11,0xd1b9a7],[30,30,12,20,13,0x9babb7],[-38,0,10,10,14,0xb5a2a1],[38,0,10,14,13,0x8c9aa4]]){cube(w,h,d,c,x,h/2,z);for(let y=3;y<h-1;y+=3)for(let xx=-w/2+2;xx<w/2-1;xx+=3)cube(1.3,1.6,.12,0xa7d9e9,x+xx,y,z+d/2+.1)}for(let i=0;i<35;i++){const x=(Math.random()-.5)*105,z=(Math.random()-.5)*105;if(Math.abs(x)<22&&Math.abs(z)<22)continue;cube(.7,3,.7,0x79583c,x,1.5,z);const tree=new THREE.Mesh(new THREE.ConeGeometry(2.3,5,7),mat(0x347e43));tree.position.set(x,5,z);scene.add(tree)}const person=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.5,1.25,5,10),mat(0x305dcb));body.position.y=1.45;person.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.44,16,12),mat(0xf0bc94));head.position.y=2.7;person.add(head);for(const x of [-.22,.22]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.3,.9,.35),mat(0x263448));leg.position.set(x,.48,0);person.add(leg)}scene.add(person);person.position.set(0,0,5);let axis={x:0,y:0};let saved={};try{saved=JSON.parse(localStorage.getItem('newlife-save')||'{}')}catch(e){}let money=saved.money??100,energy=saved.energy??100,hunger=saved.hunger??100,mood=saved.mood??80,day=saved.day??1;person.position.set(saved.x??0,0,saved.z??5);function updateHud(){for(const [id,val] of Object.entries({money,energy,hunger,mood,day}))document.getElementById(id).textContent=Math.round(val)}function save(){try{localStorage.setItem('newlife-save',JSON.stringify({money,energy,hunger,mood,day,x:person.position.x,z:person.position.z}))}catch(e){}}updateHud();setInterval(save,4000);const joy=document.getElementById('joy'),knob=document.getElementById('knob');function moveJoy(e){const r=joy.getBoundingClientRect(),x=e.clientX-r.left-62.5,y=e.clientY-r.top-62.5,l=Math.max(1,Math.hypot(x,y)),k=Math.min(45,l);axis={x:x/l*k/45,y:y/l*k/45};knob.style.transform=`translate(${axis.x*45}px,${axis.y*45}px)`}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(e.buttons)moveJoy(e)});function reset(){axis={x:0,y:0};knob.style.transform=''}joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);const keys={};onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;let timer;function notify(s){const el=document.getElementById('msg');el.textContent=s;el.style.display='block';clearTimeout(timer);timer=setTimeout(()=>el.style.display='none',2200)}document.getElementById('action').onclick=()=>{const b=buildings.find(b=>Math.hypot(person.position.x-b.x,person.position.z-(b.z+5))<8);if(!b)return notify('Подойди ближе к зданию');if(b.type==='work'){if(energy<15)return notify('Нужно отдохнуть дома');money+=50;energy-=15;hunger=Math.max(0,hunger-12);mood=Math.max(0,mood-5);notify('Смена завершена! +50 ₽')}if(b.type==='home'){energy=100;day++;mood=Math.min(100,mood+15);notify('Ты выспался! Начался новый день')}if(b.type==='shop'){if(money<20)return notify('Не хватает денег');money-=20;hunger=Math.min(100,hunger+40);mood=Math.min(100,mood+5);notify('Еда куплена: −20 ₽, +40 сытости')}updateHud();save()};document.getElementById('save').onclick=()=>{save();notify('Прогресс сохранён')};const clock=new THREE.Clock();let needsTick=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);needsTick+=dt;if(needsTick>8){needsTick=0;hunger=Math.max(0,hunger-1);if(hunger===0)energy=Math.max(0,energy-2);updateHud()}let dx=axis.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=axis.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);const l=Math.hypot(dx,dz);if(l>.05&&energy>0){dx/=l;dz/=l;const nx=THREE.MathUtils.clamp(person.position.x+dx*dt*6,-55,55),nz=THREE.MathUtils.clamp(person.position.z+dz*dt*6,-55,55);if(!buildings.some(b=>Math.abs(nx-b.x)<5.8&&Math.abs(nz-b.z)<5.3)){person.position.x=nx;person.position.z=nz;}person.rotation.y=Math.atan2(dx,dz)}const desired=new THREE.Vector3(person.position.x,person.position.y+7,person.position.z+12);camera.position.lerp(desired,.07);camera.lookAt(person.position.x,1.5,person.position.z);renderer.render(scene,camera)}animate();onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}</script></body></html>
